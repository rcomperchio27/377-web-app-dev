                    if (int(time) % 60 == 0):
                        return str(int(time) // 60) + ":00"
                    elif (int(time) % 60 < 10):
                        return str(int(time) // 60) + ":0" + str(int(time) % 60)
                    else: 
                        return str(int(time) // 60) + ":" + str(int(time) % 60)

                document["white-clock-text"].html = clockDisplay(document["game_time_1"].html)
                document["black-clock-text"].html = clockDisplay(document["game_time_1"].html)

                # ticks clock
                def updatetimer():
                    clock = document["Player-turn"].html + "-clock-text"
                    game_time = document["game_time_1"].html
                    game_time = str(int(game_time) - 1)
                    if (game_time == 0):
                        print("Game out")
                    document["game_time_1"].html = game_time
                    document[clock].html = clockDisplay(game_time)

                def updateGame():
                    updatetimer()

                timer.set_interval(updateGame, 1000)

            </script>
        </div>
    </body>
</html>
